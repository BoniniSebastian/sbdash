<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
  />
  <title>SB Dash</title>
  <link rel="stylesheet" href="style.css?v=1" />
</head>

<body>
  <!-- ================= TOPBAR ================= -->
  <header class="topbar">
    <div class="brand">
      <div class="brandDot"></div>
      <div>
        <div class="brandTitle">SB Dash</div>
        <div class="brandSub">Control dashboard</div>
      </div>
    </div>

    <div class="topDate" id="topDate">—</div>

    <div class="topRight">
      <div class="startPrioTop">Aktiva prios: <span id="startPrioCount">0</span></div>
    </div>
  </header>

  <!-- ================= APP SHELL ================= -->
  <div class="shell">

    <!-- ===== PREVIEW (always visible behind wheel) ===== -->
    <div class="previewWrap" id="previewWrap" aria-hidden="true">
      <div class="previewCard">
        <div class="previewTitle" id="previewTitle">Preview</div>
        <div class="previewBody" id="previewBody"></div>
      </div>
    </div>

    <!-- ===== START ICON (icon for current view) ===== -->
    <div class="startIconWrap" id="startIconWrap" aria-hidden="true">
      <img class="startIcon" id="startIcon" src="assets/ui/icon-calendar.svg" alt="" />
    </div>

    <!-- ===== SHEET WRAP (overlay behind wheel) ===== -->
    <div class="sheetWrap" id="sheetWrap" aria-hidden="true">
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Panel">
        <div class="sheetHeader">
          <div class="sheetTitle" id="sheetTitle">—</div>
          <button class="sheetClose" id="sheetCloseBtn" aria-label="Stäng">✕</button>
        </div>
        <div class="sheetContent" id="sheetContent"></div>
      </div>
    </div>

    <!-- ===== WHEEL (always on top) ===== -->
    <div class="wheelWrap">
      <div class="wheel" id="wheel" aria-label="Scrollhjul">
        <img src="assets/ui/knob-ring.svg" class="wheelRing" alt="ring" />
        <div id="wheelCenterText" class="wheelCenterText">—</div>
        <!-- timer pulse + timer svg injectas av JS -->
      </div>
    </div>

  </div>

  <script src="app.js?v=1"></script>
</body>
</html>

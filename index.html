<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SB Dash</title>
  <link rel="stylesheet" href="style.css?v=503" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brandDot"></div>
    <div>
      <div class="brandTitle">SB Dash</div>
      <div class="brandSub">Control dashboard</div>
    </div>
  </div>
  <div class="topDate" id="todayText">—</div>
</header>

<main class="shell">
  <section class="layout">

    <!-- MAIN (ONLY PANEL NOW) -->
    <section class="panel mainPanel">

      <!-- Timer border -->
      <svg class="mainBorderSvg" viewBox="0 0 100 100" aria-hidden="true">
        <rect class="mainBorderTrack" x="2" y="2" width="96" height="96" rx="12"></rect>
        <rect class="mainBorderProg" id="mainBorderProg" x="2" y="2" width="96" height="96" rx="12"></rect>
      </svg>

      <div class="panelHead">
        <h2>Main</h2>
      </div>

      <div class="panelBody mainBody">
        <div class="viewTrack" id="viewTrack">

          <!-- 1) CALENDAR -->
          <div class="viewPage" data-view="calendar">
            <div class="viewTitle">Kalender</div>
            <div class="calCard">
              <div class="calScale">
                <iframe
                  class="calFrame"
                  src="https://calendar.google.com/calendar/embed?src=ZXJpY3Nzb25ib25pbmlAZ21haWwuY29t&mode=AGENDA&ctz=Europe%2FStockholm&hl=sv&showTitle=0&showTabs=0&showNav=0&showPrint=0&showCalendars=0&showDate=0"
                  frameborder="0"
                  scrolling="no">
                </iframe>
              </div>
            </div>
          </div>

          <!-- 2) WEATHER -->
          <div class="viewPage" data-view="weather">
            <div class="viewTitle">Väder</div>
            <div id="weatherContent">Laddar…</div>
          </div>

          <!-- 3) NEWS -->
          <div class="viewPage" data-view="news">
            <div class="viewTitle">Nyheter</div>
            <ul id="newsList"></ul>
          </div>

          <!-- 4) TODO -->
          <div class="viewPage" data-view="todo">
            <div class="viewTitle">Att göra</div>
            <input id="todoInput" placeholder="Ny uppgift" />
            <button id="todoAddBtn">Lägg</button>
            <ul id="todoList"></ul>
          </div>

          <!-- 5) IDEAS -->
          <div class="viewPage" data-view="ideas">
            <div class="viewTitle">Idéer</div>
            <input id="ideaInput" placeholder="Ny idé" />
            <button id="ideaAddBtn">Spara</button>
            <ul id="ideasList"></ul>
          </div>

          <!-- 6) DONE -->
          <div class="viewPage" data-view="done">
            <div class="viewTitle">Slutförda</div>
            <ul id="doneList"></ul>
          </div>

          <!-- 7) AKTIV PRIO (NEW IN MAIN) -->
          <div class="viewPage" data-view="prio">
            <div class="viewTitle">Aktiv prio</div>

            <input id="prioInput" placeholder="Ny superprio" />
            <button id="prioAddBtn">Lägg</button>

            <ul id="prioList"></ul>
          </div>

          <!-- 8) TIMER -->
          <div class="viewPage" data-view="timer">
            <div class="viewTitle">Timer</div>

            <div class="timerWrap">
              <div class="timerRow">
                <div class="pomoRing">
                  <svg viewBox="0 0 240 240">
                    <circle cx="120" cy="120" r="92" class="pomoTrack"></circle>
                    <circle cx="120" cy="120" r="92" class="pomoProg" id="pomoProg"></circle>
                  </svg>
                  <div class="pomoCenter">
                    <div id="pomoTime">05:00</div>
                  </div>
                </div>

                <div class="timerButtons">
                  <button id="pomoStartBtn">Start</button>
                  <button id="pomoResetBtn">Reset</button>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

    </section>
  </section>
</main>

<script src="app.js?v=501"></script>
</body>
</html>

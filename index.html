<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>SB Dash</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>

<body>

<header class="topbar">
  <div class="brand">
    <div class="brandDot"></div>
    <div>
      <div class="brandTitle">SB Dash</div>
      <div class="brandSub">Control dashboard</div>
    </div>
  </div>
  <div class="topDate" id="topDate"></div>
</header>

<div class="shell">

  <!-- Start info -->
  <div class="startInfo">
    <img class="startIcon" id="startIcon"
         src="assets/ui/icon-calendar.svg" alt="">
    <div class="startPrio" id="startPrioCount">Aktiva prios: 0</div>
  </div>

  <!-- Sheet -->
  <div class="sheetWrap" id="sheetWrap">
    <div class="sheet" id="sheet">
      <div class="sheetHeader">
        <div class="sheetTitle" id="sheetTitle">Preview</div>
      </div>
      <div class="sheetContent" id="sheetContent"></div>
    </div>
  </div>

  <!-- Wheel -->
  <div class="wheelWrap">
    <div class="wheel" id="wheel">
      <img src="assets/ui/knob-ring.svg" class="wheelRing" alt="">
      <div id="wheelCenterText" class="wheelCenterText">KALENDER</div>
    </div>
  </div>

</div>

<script src="app.js?v=2"></script>
</body>
</html>

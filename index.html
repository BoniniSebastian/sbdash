<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>SB Dash</title>
  <link rel="stylesheet" href="style.css?v=901" />
</head>

<body>
  <!-- ================= TOPBAR ================= -->
  <header class="topbar">
    <div class="brand">
      <div class="brandDot"></div>
      <div>
        <div class="brandTitle">SB Dash</div>
        <div class="brandSub">Control dashboard</div>
      </div>
    </div>

    <div class="topDate" id="topDate"></div>

    <div class="topRight">—</div>
  </header>

  <!-- ================= APP SHELL ================= -->
  <div class="shell">

    <!-- ===== SHEET WRAP (overlay) ===== -->
    <div class="sheetWrap" id="sheetWrap">

      <!-- ===== SHEET ===== -->
      <div class="sheet" id="sheet">

        <div class="sheetHeader">
          <div class="sheetTitle" id="sheetTitle">Preview</div>
        </div>

        <div class="sheetContent" id="sheetContent">
          <!-- JS renderar content här -->
        </div>

        <!-- Drag handle -->
        <div class="sheetHandle"></div>

      </div>
    </div>

    <!-- ===== WHEEL ===== -->
    <div class="wheelWrap">

      <div class="wheel" id="wheel">

        <!-- Ring -->
        <img src="assets/ui/knob-ring.svg"
             class="wheelRing"
             alt="ring" />

        <!-- Icon -->
        <img id="wheelIcon"
             class="wheelIcon"
             src="assets/ui/icon-calendar.svg"
             alt="icon" />

      </div>

    </div>

  </div>

  <script src="app.js?v=900"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SB Dash</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brandDot"></div>
    <div>
      <div class="brandTitle">SB Dash</div>
      <div class="brandSub">Control dashboard</div>
    </div>
  </div>
  <div class="topDate" id="todayText">—</div>
  <div class="topRight"></div>
</header>

<main class="shell">

  <!-- SHEET (RUTAN) – STÄNGD FRÅN START -->
  <div class="sheetWrap" id="sheetWrap" aria-hidden="true">
    <div class="sheet" id="sheet" role="dialog" aria-modal="false" aria-label="Main sheet">

      <div class="sheetHead">
        <div class="sheetTitle">Main</div>
        <div class="sheetSub" id="sheetSub">—</div>
      </div>

      <div class="sheetBody">
        <div class="viewTrack" id="viewTrack">

          <!-- KALENDER -->
          <div class="viewPage" data-view="calendar">
            <div class="viewTitle">Kalender</div>

            <div class="calCard">
              <div class="calScale">
                <iframe
                  class="calFrame"
                  src="https://calendar.google.com/calendar/embed?src=ZXJpY3Nzb25ib25pbmlAZ21haWwuY29t&mode=AGENDA&ctz=Europe%2FStockholm&hl=sv&showTitle=0&showTabs=0&showNav=0&showPrint=0&showCalendars=0&showDate=0"
                  frameborder="0"
                  scrolling="no">
                </iframe>
              </div>
            </div>

            <div class="miniHint" style="margin-top:10px;">
              (iPhone Safari kan kräva cookies för Google iframe.)
            </div>
          </div>

          <!-- AKTIV PRIO -->
          <div class="viewPage" data-view="prio">
            <div class="viewTitle">Aktiv prio</div>

            <div class="miniForm">
              <input id="prioInput" class="miniInput" type="text" placeholder="Lägg till superprio…" maxlength="160">
              <button id="prioAddBtn" class="miniBtn">+ Lägg</button>
            </div>

            <ul class="miniList" id="prioList"></ul>
            <div class="miniHint">Swipe höger→vänster = slutför • Tryck = redigera</div>
          </div>

          <!-- VÄDER (placeholder tills vi kopplar in) -->
          <div class="viewPage" data-view="weather">
            <div class="viewTitle">Väder</div>
            <div class="miniHint">(kopplas in sen)</div>
          </div>

        </div>
      </div>

      <!-- Close-knapp nedtill centrerat -->
      <button class="sheetClose" id="sheetCloseBtn" aria-label="Stäng">✕</button>
    </div>
  </div>

</main>

<!-- HJUL – alltid synligt -->
<div class="dialFixed" aria-label="Ratt">
  <div class="dial" id="dial">
    <div class="dialGlass" aria-hidden="true"></div>

    <img class="dialRing" id="dialRing" src="assets/ui/knob-ring.svg" alt="Knob ring">

    <!-- Om SVG saknas -> vi visar emoji fallback -->
    <img class="dialIcon" id="dialIcon" src="assets/ui/icon-weather.svg" alt="Dial icon">
    <div class="dialEmoji" id="dialEmoji" aria-hidden="true">☀️</div>
  </div>
</div>

<script src="app.js?v=4"></script>
</body>
</html>

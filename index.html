<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>SB Dash</title>
  <link rel="stylesheet" href="style.css?v=1" />
</head>

<body>
  <!-- ================= TOPBAR ================= -->
  <header class="topbar">
    <div class="brand">
      <div class="brandDot"></div>
      <div>
        <div class="brandTitle">SB Dash</div>
        <div class="brandSub">Control dashboard</div>
      </div>
    </div>

    <div class="topDate" id="topDate"></div>
    <div class="topRight"></div>
  </header>

  <!-- ================= APP SHELL ================= -->
  <div class="shell">

    <!-- ===== START VIEW INFO (when sheet closed) ===== -->
    <div class="startInfo" id="startInfo">
  

      <div class="startSpacer"></div>

      <div class="startPrio" id="startPrioCount">Aktiva prios: 0</div>
    </div>

    <!-- ===== CENTER LABEL (sync with wheel icon) ===== -->
    <div class="centerLabel" id="centerLabel">KALENDER</div>

    <!-- ===== SHEET WRAP (overlay) ===== -->
    <div class="sheetWrap" id="sheetWrap">
      <div class="sheet" id="sheet">
        <div class="sheetHeader">
          <div class="sheetTitle" id="sheetTitle">Preview</div>
        </div>

        <div class="sheetContent" id="sheetContent"></div>
      </div>
    </div>

    <!-- ===== WHEEL ===== -->
    <div class="wheelWrap">
      <div class="wheel" id="wheel">

        <img src="assets/ui/knob-ring.svg" class="wheelRing" alt="ring" />

        <img id="wheelIcon" class="wheelIcon" src="assets/ui/icon-calendar.svg" alt="icon" />

      </div>
    </div>

  </div>

  <script src="app.js?v=1" defer></script>
</body>
</html>

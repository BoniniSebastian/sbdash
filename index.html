<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SB Dash</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brandDot"></div>
    <div>
      <div class="brandTitle">SB Dash</div>
      <div class="brandSub">Control dashboard</div>
    </div>
  </div>
  <div class="topDate" id="todayText">—</div>
</header>

<main class="shell">

  <section class="panel mainPanel">

    <div class="panelHead">
      <h2>Main</h2>
    </div>

    <div class="panelBody" id="mainScroll">

      <div class="sectionBlock">
        <div class="sectionTitle">Kalender</div>

        <div class="calCard">
          <div class="calScale">
            <iframe
              class="calFrame"
              src="https://calendar.google.com/calendar/embed?mode=AGENDA&ctz=Europe%2FStockholm&hl=sv&showTitle=0&showTabs=0&showNav=0&showPrint=0&showCalendars=0&showDate=0"
              frameborder="0"
              scrolling="no">
            </iframe>
          </div>
        </div>
      </div>

      <div class="sectionBlock">
        <div class="sectionTitle">Aktiv prio</div>
        <div id="prioList">
          <!-- fylls via JS -->
        </div>
      </div>

      <div style="height: 200px;"></div>

    </div>
  </section>

</main>

<!-- HJUL (delvis bakom panelen) -->
<div class="dialFixed">
  <div class="dial" id="dial">
    <div class="dialGlass"></div>
    <img class="dialRing" id="dialRing" src="assets/ui/knob-ring.svg" />
    <img class="dialIcon" id="dialIcon" src="assets/ui/icon-calendar.svg" />
  </div>
</div>

<script src="app.js?v=2"></script>
</body>
</html>
